@keyframes zoom{to{transform:scale(1.06)}}
#lluvia{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.hojacae{position:absolute;top:-90px;opacity:.28;animation:cae linear infinite}
@keyframes cae{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(26px,55vh) rotate(180deg)}100%{transform:translate(-12px,115vh) rotate(360deg)}}
main{max-width:480px;min-height:100svh;margin:0 auto;padding:max(34px,5svh) 20px 22px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center}
.logo{display:block;width:min(64%,250px);height:auto;margin:0 auto;transform:translateX(var(--logo-x));filter:drop-shadow(0 0 1px rgba(28,3,6,.9)) drop-shadow(0 4px 14px rgba(28,3,6,.8))}
#botones{width:100%;max-width:292px;margin:auto 0}
.btn:last-child{margin-bottom:0}
.pie{width:100%;margin:0;padding:0}
.btn{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:9px;box-sizing:border-box;width:100%;padding:7px 30px 7px 13px;margin:0 0 8px;border-radius:999px;text-decoration:none;text-align:left;color:var(--tx);background:var(--bg);border:1px solid rgba(255,238,200,.55);box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.btn:hover,.btn:active{transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid var(--crema);outline-offset:3px}
.crema{--bg:#efe5d0;--tx:#3a2a1a}.verde{--bg:#3f5b2b;--tx:#f3ead2}.naranja{--bg:#b4451f;--tx:#fbeedd}.amarillo{--bg:#deb12f;--tx:#3a2a10}.vinotinto{--bg:#741c2c;--tx:#f6e6c8}
.btn>*:not(.hoja){position:relative;z-index:1}
.ic{flex:none;width:19px;height:19px;display:flex}.ic svg{width:100%;height:100%}
.txt{flex:1;min-width:0}
.btn b{display:block;font-family:Cinzel,Georgia,serif;font-weight:600;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.btn small{display:block;font-size:.58rem;font-weight:500;opacity:.88;margin-top:1px;line-height:1.2}
.fl{flex:none;width:10px;height:10px}
.hoja{position:absolute;right:-6px;top:50%;width:46px;height:46px;margin-top:-23px;transform:rotate(-8deg);pointer-events:none;opacity:.55;color:var(--hc)}
.hoja svg{width:100%;height:100%}
.hoja.pl{background:var(--hoja) center/contain no-repeat;filter:grayscale(1);mix-blend-mode:screen;opacity:.3}
.crema .hoja.pl,.amarillo .hoja.pl{mix-blend-mode:multiply;opacity:.45}
